# Single source of truth for screw_sorting online RL and offline warmup BCQ.
# Machine B / rollout / offline_train_from_replay all load this file.
# Do not fork copies under runs/*/checkpoints/online_rl_config.yaml.
experiment:
  rl:
    action_dim: 7
    chunk_len: 10
    z_dim: 2048
    proprio_dim: 7
    action_representation: delta_chunk
    action_norm_stats_path: configs/tasks/screw_sorting/stats/norm_stats_delta.json

    gamma: 0.99
    fixed_std: 0.002
    reference_dropout_prob: 0.5
    bc_reduction: sum
    target_q_clip: 100.0
    grad_clip_norm: 1.0
    action_clip_min: -1.0
    action_clip_max: 1.0
    # delta_weight scales ||Δμ - Δref||²; acc/jerk use OpenPI-style weights (dt=1/control_frequency_hz).
    delta_weight: 0.0
    control_frequency_hz: 30.0
    delta_acc_weight: 500.0
    delta_jerk_weight: 500.0
    # L2C2 smoothness (HoST). 0 = off. Try policy=1.0, critic=0.1 to start.
    l2c2_policy_weight: 0.0
    l2c2_critic_weight: 0.0
    warmup_bc_weight: 3.0
    warmup_q_weight: 1.0
    online_bc_weight: 3.0
    online_q_weight: 1.0
    # Phased ablations. Enable one extra stage at a time; restart the learner.
    # Stage 1 (this run): HUMAN/MIXED steps BC to executed action. Actor still sees VLA ref.
    #   Set false to restore the previous "BC always to VLA" run.
    bc_imitate_human: true

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2

    actor_lr: 0.0001
    critic_lr: 0.0001
    target_tau: 0.005
    actor_update_period: 2

    warmup_min_size: 1200
    warmup_post_collect_updates: 50000
    freeze_after_warmup: false
    grad_updates_per_cycle: 5

runtime:
  actor_service:
    pull_params_interval_sec: 0.25
    rpc_timeout_sec: 0.2
    bind_host: 127.0.0.1
    port: 9101
    snapshot_path: runs/screw_sorting/actor_snapshot/actor_snapshot.pkl
    xla_mem_fraction: 0.10
    xla_preallocate: false

  learner_service:
    push_actor_interval_steps: 500
    checkpoint_interval_steps: 1000
    sample_batch_size: 256
    checkpoint_dir: runs/screw_sorting/checkpoints
    actor_snapshot_path: runs/screw_sorting/actor_snapshot/actor_snapshot.pkl
    replay_url: http://127.0.0.1:9102
    poll_interval_sec: 0.01
    xla_mem_fraction: 0.75
    xla_preallocate: false

  replay:
    capacity: 200000
    journal_path: runs/screw_sorting/replay/replay_journal.pkl
    bind_host: 127.0.0.1
    port: 9102
    seed: 0
    # Stage 2 (after Stage 1): stratified mix so warmup does not dominate the batch.
    # sample_strategy: stratified
    # recent_episode_window: 20
    # recent_online_ratio: 0.4
    # warmup_demo_ratio: 0.3
    # human_intervention_ratio: 0.3

  env_driver:
    machine_a_ws_url: ws://0.0.0.0:8000
    actor_service_url: http://127.0.0.1:9101
    replay_service_url: http://127.0.0.1:9102
    task_mode: full_task
    episode_start_control_mode: policy
    full_task_reset_action:
    - -0.00133514404296875
    - 0.00438690185546875
    - 0.034523963928222656
    - -0.053597450256347656
    - -0.00476837158203125
    - -0.00209808349609375
    - 0.09
    critical_phase_reset_action:
    - -0.00133514404296875
    - 0.00438690185546875
    - 0.034523963928222656
    - -0.053597450256347656
    - -0.00476837158203125
    - -0.00209808349609375
    - 0.09
    actor_deterministic: true
    # Paper screw vla_horizon=50; RL chunk_length=10 (Evo ac_paper_screw.yaml).
    vla_chunk_exec_horizon: 50
    rl_chunk_exec_horizon: null
    # RTC defaults match Evo-RLT ``record collect`` CLI.
    use_rtc: true
    rtc_vla_guidance: true
    rtc_execution_horizon_vla: 20
    rtc_execution_horizon_rl: 10
    # null → latency tracker (skips first samples / JIT); set int for a fixed JIT ``d``.
    rtc_inference_delay: 7
    action_queue_size_to_get_new_actions: 30
    control_frequency_hz: 30.0
    step_trace_stride: 2
    replay_feature_batch_size: 16
    enable_human_override: false
    safe_fallback_to_ref: true
    # Policy action LPF (deploy + offline smoothness sim). Same flag gates both.
    # false → deploy off, smooth skips LPF sim; true → both on (cutoff below).
    use_actions_filter: true
    action_lpf_cutoff_freq: 5.0
    action_lpf_dt: null
    machine_a_connect_timeout_sec: 10.0
    machine_a_recv_timeout_sec: 10.0
    machine_a_retry_interval_sec: 0.5
    actor_request_timeout_sec: 2.0
    replay_request_timeout_sec: 30.0

  monitoring:
    enable_wandb: true
    wandb_project: rlt-online-rl
    wandb_entity: null
    wandb_mode: offline
    wandb_run_name: screw_sorting
    wandb_dir: runs/screw_sorting/wandb

  role: all
  local_debug_mode: false
