experiment:
  rl:
    action_dim: 7
    chunk_len: 10
    z_dim: 2048
    proprio_dim: 32

    gamma: 0.99
    fixed_std: 0.05
    reference_dropout_prob: 0.5
    bc_reduction: mean
    target_q_clip: 100.0
    grad_clip_norm: 1.0
    action_clip_min: -1.0
    action_clip_max: 1.0
    delta_weight: 0.0
    delta_acc_weight: 100.0
    delta_jerk_weight: 100.0
    control_frequency_hz: 30.0
    # L2C2 (HoST): set >0 to enable; paper uses policy≈1.0, critic≈0.1
    l2c2_policy_weight: 0.0
    l2c2_critic_weight: 0.0

    actor_hidden_dim: 256
    actor_num_layers: 2
    critic_hidden_dim: 256
    critic_num_layers: 2

    actor_lr: 0.0003
    critic_lr: 0.0003
    target_tau: 0.005
    actor_update_period: 2

    warmup_min_size: 1000
    warmup_post_collect_updates: null
    freeze_after_warmup: false
    grad_updates_per_cycle: 5
